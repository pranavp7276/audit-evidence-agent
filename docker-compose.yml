services:
  db:
    image: postgres:16
    container_name: audit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-audit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audit}
      POSTGRES_DB: ${POSTGRES_DB:-audit}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-audit} -d ${POSTGRES_DB:-audit}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
