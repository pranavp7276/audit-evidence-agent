name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: audit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U audit" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://audit:audit@localhost:5432/audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrations apply cleanly on an empty database
        run: python scripts/migrate.py
      - name: Migrations are idempotent
        run: python scripts/migrate.py | grep -q "up to date"
      - name: Tests (incl. database guardrails)
        run: pytest -q
