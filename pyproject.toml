[project]
name = "audit-evidence-agent"
version = "0.1.0"
description = "Agent that answers lender/regulator audit requests on outsourced collections with a cited evidence pack and gap report."
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.package-data]
"agent.web" = ["static/*"]

[tool.setuptools.packages.find]
include = ["agent*", "eval*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"agent/web/rules.py" = ["E501"]  # plain-language text for auditors
"agent/web/app.py" = ["E501"]  # long SQL and response builders
"agent/pack/writer.py" = ["E501"]  # letter and pack text
"agent/parser/request_parser.py" = ["E501"]  # question wording
"agent/checks/*.py" = ["E501"]  # finding reasons read as sentences
"agent/pipeline.py" = ["E501"]
"agent/guardrails.py" = ["E501"]
"agent/llm.py" = ["E501"]
"tests/*.py" = ["E501"]
"agent/tools/*.py" = ["E501"]  # docstrings that describe the rows
"scripts/gen_*.py" = ["E501"]  # data generators
