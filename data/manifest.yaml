# Which source file lands in which raw table. Committed to git; the data files are not.
# Put the files under data/raw/ exactly at these paths (they live on the shared drive).
# `make load` loads every entry whose file exists and warns about the rest.
#
# Fill in `file` names once we have the actual deliverables. Supported formats: csv, xlsx (first sheet
# unless `sheet` is given), json (array of objects), jsonl.
#
# Every raw table gets two extra columns:
#   _row_no      1-based row number in the source file (used as record_key when no natural key)
#   _source_file the file it came from

datasets:
  - table: d4_contact_log
    source_system: D4
    file: raw/D4.csv            # TODO: confirm name
    description: Contact log (calls, WhatsApp, SMS) per account and collector
    natural_key: null           # TODO: e.g. contact_id

  - table: d5
    source_system: D5
    file: raw/D5.csv            # TODO
    description: TODO
    natural_key: null

  - table: d10
    source_system: D10
    file: raw/D10.csv           # TODO
    description: TODO
    natural_key: null

  - table: d11
    source_system: D11
    file: raw/D11.csv           # TODO
    description: TODO
    natural_key: null

  - table: d12
    source_system: D12
    file: raw/D12.csv           # TODO
    description: Policy limits incl. calling hours and frequency
    natural_key: null

  - table: notice_dispatch
    source_system: notice_dispatch
    file: raw/notice_dispatch.csv   # TODO
    description: Notices sent in the last 12 months, dispatch and service dates
    natural_key: null

  - table: holiday_calendar
    source_system: holiday_calendar
    file: raw/holiday_calendar.csv  # TODO
    description: National and state holidays 2026-27
    natural_key: null

  - table: collector_roster
    source_system: collector_roster
    file: raw/collector_roster.csv  # TODO
    description: About 1,200 collectors; IDs match D4
    natural_key: null

  - table: cert_register
    source_system: cert_register
    file: raw/cert_register.csv     # TODO
    description: Collector certifications with validity dates
    natural_key: null
